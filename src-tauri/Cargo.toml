[package]
name = "cable-optimizer"
version = "1.0.0"
description = "Minimum Bounding Circle Visual Solver"
authors = ["AI Studio"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "cable_optimizer"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
