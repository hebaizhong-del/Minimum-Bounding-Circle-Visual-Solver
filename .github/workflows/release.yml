name: 'Publish Tauri App'

on:
  workflow_dispatch: # Allow manual trigger in GitHub Actions UI
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies and build frontend
        run: |
          npm install
          npm run build

      - name: Generate desktop app icons
        run: npx tauri icon app-icon.svg

      - name: Build Tauri desktop application (.exe)
        run: npx tauri build

      - name: Upload .exe build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CableOptimizer-Windows-exe
          path: |
            src-tauri/target/release/CableOptimizer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/CableOptimizer.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
