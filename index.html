<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimum Bounding Circle Visual Solver</title>
    <meta name="description" content="Interactive minimum bounding circle visual solver and cable packing layout optimizer.">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
    <link rel="stylesheet" href="./css/style.css?v=1.3.0">
</head>
<body>

    <header
      style="
        width: 100%;
        padding-top: 0px;
        padding-bottom: 0px;
        padding-left: 20px;
        padding-right: 20px;
        background-color: #ffffff;
        border-bottom: 1px solid #eee;
      "
    >
      <div class="cable-header-inner">
        <h1 style="font-size: 18px;">
          <!-- Header Icon -->
          <div
            class="cable-circle-3-wrap"
            onclick="window.location.href='index.html'"
            title="Reset to Default"
            style="width: 20px; height: 18px; position: relative; display: inline-block;"
          >
            <div
              style="
                width: 8px;
                height: 8px;
                top: 1px;
                left: 6px;
                background-color: #f97316;
                border-radius: 50%;
                border: 1px solid #f97316;
                position: absolute;
              "
            ></div>
            <div
              style="
                width: 8px;
                height: 8px;
                bottom: 1px;
                left: 2px;
                background-color: #f97316;
                border-radius: 50%;
                border: 1px solid #f97316;
                position: absolute;
              "
            ></div>
            <div
              style="
                width: 8px;
                height: 8px;
                bottom: 1px;
                right: 2px;
                background-color: #f97316;
                border-radius: 50%;
                border: 1px solid #f97316;
                position: absolute;
              "
            ></div>
          </div>
          Minimum Bounding Circle Visual Solver
        </h1>
      </div>
    </header>

    <div class="main-container">
        <div class="main-content-wrapper">
            <div class="workspace-row">
                <!-- Control Panel -->
                <div class="panel-control">
                    <h2 style="font-size: 18px;">Input Circle Parameters</h2>
                    <div class="form-group">
                        <label for="radii-input" style="font-weight: bold; font-size: 14px;">Circle Radii / Diameters List (comma-separated)</label>
                        <textarea id="radii-input" style="width: 100%; height: 76px; padding: 9px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 0px; font-family: inherit; font-size: 0.95rem; line-height: 1.5; resize: none; overflow-y: auto; word-break: break-all; word-wrap: break-word; outline: none; margin-bottom: 8px;">10, 10, 10, 4, 4, 4, 4, 4</textarea>
                        
                        <div style="margin-top: 4px; margin-bottom: 12px; padding-bottom: 18px; display: flex; gap: 20px;">
                            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 0; font-size: 12px; color: #073a40;">
                                <input type="radio" name="input-type" value="radius" checked style="width: auto; cursor: pointer;"> Radius (R)
                            </label>
                            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 0; font-size: 12px; color: #073a40;">
                                <input type="radio" name="input-type" value="diameter" style="width: auto; cursor: pointer;"> Diameter (D)
                            </label>
                        </div>

                        <div class="preset-btns" style="height: auto; align-items: center;">
                            <span style="font-weight: bold; font-size: 14px; color: #073a40; white-space: nowrap;">Presets:</span>
                            <button class="btn-zoom" onclick="setPreset('10, 10, 10, 4, 4, 4, 4, 4')" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc; height: 30.5px;">3 Large + 5 Small</button>
                            <button class="btn-zoom" onclick="setPreset('10, 10, 10, 10, 10, 10, 10')" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc; height: 30.5px;">7 Equal Circles</button>
                            <button class="btn-zoom" onclick="setPreset('12, 10, 8, 6, 5, 4, 3, 2')" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc; height: 30.5px;">8 Decreasing</button>
                            <button class="btn-zoom" onclick="setPreset('12, 10, 8, 6, 5, 4, 3, 2, 10, 8, 6, 2, 10, 8, 5, 4, 3, 2, 10, 8, 6, 5, 4, 3, 2, 10, 8, 6, 5, 4, 3, 2')" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc; height: 30.5px;">32 Unequal</button>
                        </div>
                    </div>
                    <div class="form-row" style="display: none;">
                        <div class="form-group">
                            <label for="similarTol">Radius Tolerance (similarTol):</label>
                            <input type="number" id="similarTol" value="0.05" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="symTol">Symmetry Tolerance (symTol):</label>
                            <input type="number" id="symTol" value="0.02" step="0.01">
                        </div>
                    </div>
                    <div class="form-row" style="display: none;">
                        <div class="form-group">
                            <label for="starts">Solver Starts (starts):</label>
                            <input type="number" id="starts" value="20" step="5">
                        </div>
                        <div class="form-group">
                            <label for="seed">Random Seed (seed):</label>
                            <input type="number" id="seed" value="1">
                        </div>
                    </div>
                    <button id="btn-calc" class="btn-primary" onclick="runCalculation()" style="font-size: 14px; font-weight: normal; margin-top: 12px;">Calculate Layout</button>
                    <div id="loading" class="loading">⏳ Calculating layout...</div>

                    <div id="result-info" style="display: none; margin-top: 24px; padding-top: 0px;"></div>
                </div>

                <!-- Preview & Result Area -->
                <div class="panel-preview">
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 8px; flex-wrap: wrap;">
                        <!-- Action / Export Buttons -->
                        <div class="btn-group" id="action-btns" style="display: none; margin-top: 0; gap: 8px; background-color: #ffffff; border-color: #ffffff; border-width: 0px;">
                            <button class="btn-zoom" onclick="downloadSVG()" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc;">Export SVG</button>
                            <button class="btn-zoom" onclick="downloadPNG()" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc;">Export PNG</button>
                            <button class="btn-zoom" onclick="downloadCSV()" style="border-radius: 0px; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-color: #2148bc;">Export CSV</button>
                        </div>
                        
                        <!-- Viewport Controls -->
                        <div class="zoom-controls" id="zoom-controls" style="display: none; position: static; background: none; border: none; box-shadow: none; padding: 0; gap: 6px;">
                            <button class="btn-zoom" onclick="zoomIn()" style="border-radius: 0px; padding: 6px 10px; font-size: 0.8rem; margin: 0;">🔍 +</button>
                            <button class="btn-zoom" onclick="zoomOut()" style="border-radius: 0px; padding: 6px 10px; font-size: 0.8rem; margin: 0;">🔍 -</button>
                            <button class="btn-zoom" onclick="resetZoom()" style="border-radius: 0px; padding: 6px 10px; font-size: 0.8rem; margin: 0;">↺ Reset</button>
                        </div>
                    </div>
                    
                    <div id="output-svg">
                        <div class="hint-banner" id="hint-banner" style="display: none;">
                            
                        </div>
                        <span id="placeholder-text" style="color: #94a3b8;">Click &ldquo;Calculate Layout&rdquo; to generate visual layout</span>
                    </div>


                </div>
            </div>
        </div>
    </div>

    <script src="./js/aicable.js"></script>
</body>
</html>
